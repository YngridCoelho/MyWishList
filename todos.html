<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Todos os Produtos</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        WishList
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

    </nav>

    <div class="clear"></div>

</header>

<section class="titulo-pagina">

    <h1>
        Todos os produtos
    </h1>

    <p>
        Veja todos os produtos da sua wishlist
    </p>

</section>

<div class="wrapper">

    <aside>

        <h2>
            Categorias
        </h2>

        <a href="todos.html">
            Todos
        </a>

        <a href="desejados.html">
            Desejados
        </a>

        <a href="comprados.html">
            Comprados
        </a>

    </aside>

    <main>

        <section
        class="cards"
        id="cards">

        </section>

    </main>

    <div class="clear"></div>

</div>

<footer>

    <h3>
        WishList
    </h3>

</footer>


<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="fecharModal()">&times;</span>
        <h2>Editar Produto</h2>
        <input type="hidden" id="editId">
        <input type="text" id="editNome" placeholder="Nome do produto">
        <input type="text" id="editPreco" placeholder="Preço">
        <input type="text" id="editImagem" placeholder="URL da imagem">
        <select id="editLoja">
            <option value="Shopee">Shopee</option>
            <option value="Amazon">Amazon</option>
            <option value="Mercado Livre">Mercado Livre</option>
            <option value="Shein">Shein</option>
            <option value="Aliexpress">Aliexpress</option>
            <option value="Temu">Temu</option>
            <option value="Dafiti">Dafiti</option>
            <option value="O Boticário">O Boticário</option>
        </select>
        <select id="editPrioridade">
            <option value="Alta">Alta prioridade</option>
            <option value="Média">Média prioridade</option>
            <option value="Baixa">Baixa prioridade</option>
        </select>
        <button onclick="salvarEdicao()">Salvar alterações</button>
    </div>
</div>

<script src="script.js"></script>

</body>

</html>
