<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<script>
    window.addEventListener('load', () => {
        registerSW();
    });

    async function registerSW() {
        if ('serviceWorker' in navigator) {
            try {
                await navigator
                    .serviceWorker
                    .register('serviceworker.js');
            }

            catch (e) {
                console.log('SW registration failed');
            }
        }
    }
</script>

<title>WishList</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        WishList
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="todos.html">
            Todos
        </a>

        <a href="desejados.html">
            Desejados
        </a>

        <a href="comprados.html">
            Comprados
        </a>

    </nav>

    <div class="clear"></div>

</header>

<section class="parallax">

    <div class="floating-icons">

        <img src="./imagens/amazon.png" class="icon icon1">

        <img src="./imagens/ali.png" class="icon icon2">

        <img src="./imagens/ml.png" class="icon icon3">

        <img src="./imagens/shein.png" class="icon icon4">

        <img src="./imagens/shopee.png" class="icon icon5">
     



    </div>

    <div class="overlay">

        <h1>
            Organize tudo o que você deseja comprar
        </h1>

        <p>
            Sua wishlist moderna
        </p>

    </div>

</section>

<div class="wrapper">

    <aside>

        <h2>
            Categorias
        </h2>

        <a href="todos.html">
            Todos
        </a>

        <a href="desejados.html">
            Desejados
        </a>

        <a href="comprados.html">
            Comprados
        </a>

    </aside>

    <main>

        <section class="formulario">

            <h2>
                Adicionar produto
            </h2>

            <input
            type="text"
            id="nome"
            placeholder="Nome do produto">

            <input
            type="number"
            id="preco"
            placeholder="Preço">

            <input
            type="text"
            id="imagem"
            placeholder="URL da imagem">

           <select id="loja">
            <option value="Shopee">Shopee</option>
            <option value="Amazon">Amazon</option>
            <option value="Mercado Livre">Mercado Livre</option>
            <option value="Shein">Shein</option>
            <option value="Aliexpress">Aliexpress</option>
            <option value="Temu">Temu</option>
            <option value="Dafiti">Dafiti</option>
            <option value="O Boticário">O Boticário</option>
        </select>

            <select id="prioridade">

                <option value="Alta">
                    Alta prioridade
                </option>

                <option value="Média">
                    Média prioridade
                </option>

                <option value="Baixa">
                    Baixa prioridade
                </option>

            </select>

            <button
            type="button"
            onclick="adicionarProduto()">

            Adicionar produto

            </button>

        </section>

    </main>

    <div class="clear"></div>

</div>

<footer>

    <h3>
        WishList
    </h3>

</footer>

<script src="script.js"></script>

</body>

</html>
